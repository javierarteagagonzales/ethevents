name: 📅 Sync Events from Issues

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
  workflow_run:
    workflows: ["🔖 Approve Event via Comment"]
    types: [completed]

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: sync-deploy
  cancel-in-progress: true

jobs:
  sync-events:
    # Solo corre si es manual, si se completa la aprobación, if labeled, etc.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issues' && (
        github.event.label.name == 'approved' || 
        contains(github.event.issue.labels.*.name, 'approved')
      ))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Parse issues → events.json → deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate events.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Cargar eventos actuales para no perder los migrados
            let existingEvents = [];
            if (fs.existsSync('events.json')) {
              try {
                existingEvents = JSON.parse(fs.readFileSync('events.json', 'utf8'));
              } catch (e) {
                console.log('No existing events.json found or invalid format');
              }
            }

            // 2. Fetch de issues del repositorio actual
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'approved',
                state: 'all',
                per_page: 100,
              }
            );

            function extract(body, heading) {
              if (!body) return '';
              const re = new RegExp(
                `###\\s*[^\\n]*${heading}[^\\n]*\\n+([\\s\\S]*?)(?=\\n###|$)`,
                'i'
              );
              const m = body.match(re);
              if (!m) return '';
              return m[1]
                .replace(/<!--.*?-->/gs, '')
                .replace(/_No response_/gi, '')
                .trim();
            }

            function clean(str) {
              return (str || '')
                .replace(/^```markdown\s*/gi, '')
                .replace(/```\s*$/g, '')
                .trim();
            }

            const currentRepoIssues = issues.map(issue => {
              const body = issue.body || '';
              const rawDate = clean(extract(body, 'Fecha'));
              const parsedDate = rawDate ? new Date(rawDate) : null;
              const rawParentId = clean(extract(body, 'Evento Padre ID'));
              const parentId = rawParentId && !isNaN(parseInt(rawParentId, 10)) ? parseInt(rawParentId, 10) : null;

              return {
                id: issue.number + 48,
                title: clean(extract(body, 'Nombre') || issue.title.replace(/\[EVENTO\]\s*/i, '')),
                description: clean(extract(body, 'Descripci')),
                date: rawDate,
                endDate: clean(extract(body, 'Fecha de fin') || extract(body, 'Término') || extract(body, 'Fin')),
                time: clean(extract(body, 'Hora')),
                location: clean(extract(body, 'Ubicaci')),
                type: clean((extract(body, 'Tipo') || 'meetup').toLowerCase().replace(/[^a-z]/g, '')),
                link: clean(extract(body, 'Link')),
                tags: (clean(extract(body, 'Tags')) || '').split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
                image: (body.match(/!\[.*?\]\((.*?)\)/) || body.match(/<img.*?src=["'](.*?)["']/) || [])[1] || '',
                organizer: clean(extract(body, 'Organizador')),
                parentId: parentId,
                issueUrl: issue.html_url,
                issueNum: issue.number,
                state: issue.state,
                createdAt: issue.created_at,
                _sortDate: parsedDate && !isNaN(parsedDate) ? parsedDate : null,
              };
            });

            // 3. Fusión: Mantener eventos migrados (de otros repos) + Actualizar los de este repo
            const currentRepoBaseUrl = `github.com/${context.repo.owner}/${context.repo.repo}/issues/`.toLowerCase();
            
            // Filtramos los existentes para quedarnos solo con los que NO son de este repositorio (los migrados)
            const legacyEvents = existingEvents.filter(e => {
              const url = (e.issueUrl || '').toLowerCase();
              return !url.includes(currentRepoBaseUrl);
            });

            // Combinamos legacy + nuevos
            const allEvents = [...legacyEvents, ...currentRepoIssues];

            // 4. Ordenar por fecha
            allEvents.sort((a, b) => {
              const dateA = a._sortDate || (a.date ? new Date(a.date) : new Date(0));
              const dateB = b._sortDate || (b.date ? new Date(b.date) : new Date(0));
              return dateA - dateB;
            });

            // Remover campo temporal y guardar
            const finalEvents = allEvents.map(({ _sortDate, ...rest }) => rest);

            fs.writeFileSync('events.json', JSON.stringify(finalEvents, null, 2));
            console.log(`✅ Total: ${finalEvents.length} eventos (${legacyEvents.length} migrados, ${currentRepoIssues.length} locales)`);


      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add events.json
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "chore: sync events.json [skip ci]"

          # sync seguro
          git pull --rebase origin main
          git push origin main

      - name: Install dependencies
        run: npm ci

      - name: Build Astro static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
